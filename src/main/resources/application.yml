spring:
  application:
    name: simple-token-bucket

  datasource:
    url: jdbc:postgresql://localhost:5432/simple-token-bucket
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 1800000

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

rate-limit:
  bucket-key: target-service
  capacity: 3
  refill-rate: 3
  sync:
    max-wait-ms: 2000
    poll-interval-ms: 20
    min-tokens-after: 0
  async:
    min-tokens-after: 1
    poll-delay-ms: 50
    retry-delay-ms: 200

logging:
  level:
    org.example.tokenbucket: DEBUG
    org.springframework.jdbc: DEBUG
